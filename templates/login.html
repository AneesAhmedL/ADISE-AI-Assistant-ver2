<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADISE - Login / Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: #1e293b; padding: 2.2rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-card h2 { text-align: center; margin-bottom: 1.5rem; color: #38bdf8; font-size: 1.6rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; color: #94a3b8; }
        .form-group input { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
        .form-group input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 6px; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; font-size: 1rem; }
        .btn:hover { background: #0369a1; }
        .btn:disabled { background: #475569; cursor: not-allowed; }
        .toggle-text { margin-top: 1.2rem; text-align: center; font-size: 0.85rem; color: #94a3b8; }
        .toggle-text a { color: #38bdf8; text-decoration: none; cursor: pointer; font-weight: bold; }
        .alert { margin-bottom: 1rem; padding: 0.6rem; border-radius: 6px; font-size: 0.85rem; text-align: center; display: none; }
        .alert.error { background: #7f1d1d; color: #fca5a5; }
        .alert.success { background: #14532d; color: #86efac; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="formTitle">Login to ADISE</h2>
    <div id="alertBox" class="alert"></div>

    <form id="authForm">
        <div class="form-group" id="usernameGroup" style="display: none;">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username">
        </div>
        <div class="form-group" id="loginIdGroup">
            <label id="loginIdLabel" for="loginId">Username or Email</label>
            <input type="text" id="loginId" placeholder="Enter username or email" required>
        </div>
        <div class="form-group" id="passwordGroup">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <div class="form-group" id="otpGroup" style="display: none;">
            <label for="otp">Enter OTP Code</label>
            <input type="text" id="otp" placeholder="6-digit verification code" maxlength="6">
        </div>

        <button type="submit" class="btn" id="submitBtn">Login</button>
    </form>

    <div class="toggle-text">
        <span id="toggleMsg">Don't have an account?</span>
        <a id="toggleBtn">Register</a>
    </div>
</div>

<script>
    let isRegistering = false;
    let awaitingOTP = false;

    const formTitle = document.getElementById("formTitle");
    const usernameGroup = document.getElementById("usernameGroup");
    const loginIdGroup = document.getElementById("loginIdGroup");
    const passwordGroup = document.getElementById("passwordGroup");
    const otpGroup = document.getElementById("otpGroup");

    const loginIdLabel = document.getElementById("loginIdLabel");
    const loginIdInput = document.getElementById("loginId");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const otpInput = document.getElementById("otp");

    const submitBtn = document.getElementById("submitBtn");
    const toggleMsg = document.getElementById("toggleMsg");
    const toggleBtn = document.getElementById("toggleBtn");
    const alertBox = document.getElementById("alertBox");

    toggleBtn.addEventListener("click", () => {
        isRegistering = !isRegistering;
        awaitingOTP = false;
        alertBox.style.display = "none";
        
        loginIdGroup.style.display = "block";
        passwordGroup.style.display = "block";
        otpGroup.style.display = "none";
        otpInput.required = false;

        if (isRegistering) {
            formTitle.textContent = "Register for ADISE";
            usernameGroup.style.display = "block";
            usernameInput.required = true;
            loginIdLabel.textContent = "Email";
            loginIdInput.placeholder = "Enter email";
            loginIdInput.type = "email";
            submitBtn.textContent = "Send Verification OTP";
            toggleMsg.textContent = "Already have an account?";
            toggleBtn.textContent = "Login";
        } else {
            formTitle.textContent = "Login to ADISE";
            usernameGroup.style.display = "none";
            usernameInput.required = false;
            loginIdLabel.textContent = "Username or Email";
            loginIdInput.placeholder = "Enter username or email";
            loginIdInput.type = "text";
            submitBtn.textContent = "Login";
            toggleMsg.textContent = "Don't have an account?";
            toggleBtn.textContent = "Register";
        }
    });

    document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        // Step 1: Handle Login
        if (!isRegistering) {
            try {
                const res = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: loginIdInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                const data = await res.json();
                if (res.ok && data.status === "success") {
                    alertBox.className = "alert success";
                    alertBox.textContent = data.message;
                    alertBox.style.display = "block";
                    setTimeout(() => window.location.href = "/chat_page", 800);
                } else {
                    alertBox.className = "alert error";
                    alertBox.textContent = data.message || "Login failed.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert error";
                alertBox.textContent = "Server communication failed.";
                alertBox.style.display = "block";
            }
            return;
        }

        // Step 2: Handle Initial OTP Dispatch
        if (isRegistering && !awaitingOTP) {
            try {
                submitBtn.textContent = "Sending OTP...";
                submitBtn.disabled = true;

                const res = await fetch("/send_otp", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: usernameInput.value.trim(),
                        email: loginIdInput.value.trim(),
                        password: passwordInput.value
                    })
                });

                const data = await res.json();
                submitBtn.disabled = false;

                if (res.ok && data.status === "success") {
                    awaitingOTP = true;
                    alertBox.className = "alert success";
                    alertBox.textContent = data.message;
                    alertBox.style.display = "block";

                    usernameGroup.style.display = "none";
                    loginIdGroup.style.display = "none";
                    passwordGroup.style.display = "none";
                    otpGroup.style.display = "block";
                    otpInput.required = true;
                    submitBtn.textContent = "Verify OTP & Complete Registration";
                } else {
                    submitBtn.textContent = "Send Verification OTP";
                    alertBox.className = "alert error";
                    alertBox.textContent = data.message || "Failed to send OTP.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.textContent = "Send Verification OTP";
                alertBox.className = "alert error";
                alertBox.textContent = "Server communication failed.";
                alertBox.style.display = "block";
            }
            return;
        }

        // Step 3: Verify OTP and Register Account
        if (isRegistering && awaitingOTP) {
            try {
                const res = await fetch("/verify_otp_and_register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ otp: otpInput.value.trim() })
                });

                const data = await res.json();

                if (res.ok && data.status === "success") {
                    alertBox.className = "alert success";
                    alertBox.textContent = data.message;
                    alertBox.style.display = "block";

                    setTimeout(() => toggleBtn.click(), 1200);
                } else {
                    alertBox.className = "alert error";
                    alertBox.textContent = data.message || "Verification failed.";
                    alertBox.style.display = "block";
                }
            } catch (err) {
                alertBox.className = "alert error";
                alertBox.textContent = "Server communication failed.";
                alertBox.style.display = "block";
            }
        }
    });
</script>

</body>
</html>
