<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADISE Admin Dashboard</title>
    <style>
        body { background: #0b0b13; color: #e2e8f0; font-family: sans-serif; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d42; padding-bottom: 15px; margin-bottom: 20px; }
        h2 { margin: 0; color: #818cf8; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: #161622; border: 1px solid #2d2d42; border-radius: 10px; padding: 15px; height: 75vh; overflow-y: auto; }
        .user-item { padding: 12px; background: #1e1e2f; margin-bottom: 8px; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: 1px solid transparent; }
        .user-item:hover { background: #26263d; }
        .user-item.active { background: #312e81; border-color: #6366f1; }
        .chat-bubble { padding: 10px 14px; margin: 10px 0; border-radius: 8px; font-size: 0.9rem; max-width: 85%; line-height: 1.4; }
        .chat-bubble.u { background: #374151; margin-left: auto; color: #fff; }
        .chat-bubble.b { background: #1f2937; border: 1px solid #374151; color: #e5e7eb; }
        .time { font-size: 0.7rem; color: #9ca3af; margin-top: 4px; display: block; text-align: right; }
    </style>
</head>
<body>
    <header>
        <h2>🛡️ ADISE Secure Admin Panel</h2>
        <button onclick="logout()">Logout</button>
    </header>

    <div class="grid">
        <div class="card">
            <h3 style="margin-top:0; color:#cbd5e1;">Registered Users (<span id="userCount" style="color:#818cf8;">0</span>)</h3>
            <div id="usersList">Loading users...</div>
        </div>
        <div class="card">
            <h3 style="margin-top:0; color:#cbd5e1;">User Chat History</h3>
            <div id="chatHistoryBox" style="color: #6b7280; display:flex; height:90%; align-items:center; justify-content:center;">Select a user from the left panel to inspect their chat logs.</div>
        </div>
    </div>

    <script>
        let globalData = {};

        async function fetchAdminData() {
            try {
                const res = await fetch('/adise_secure_admin_portal_99/api/data');
                if(res.ok) {
                    globalData = await res.json();
                    renderUsers();
                } else {
                    window.location.href = '/adise_secure_admin_portal_99';
                }
            } catch(e) {
                console.error("Failed to load admin data:", e);
            }
        }

        function renderUsers() {
            const container = document.getElementById('usersList');
            document.getElementById('userCount').innerText = globalData.users ? globalData.users.length : 0;
            container.innerHTML = "";

            if(!globalData.users || globalData.users.length === 0) {
                container.innerHTML = "<p style='color:#6b7280;'>No users registered yet.</p>";
                return;
            }

            globalData.users.forEach(user => {
                const div = document.createElement('div');
                div.className = "user-item";
                div.innerHTML = `<strong style="color:#f8fafc; font-size:1rem;">${escapeHtml(user.username)}</strong><br><small style="color:#94a3b8;">${escapeHtml(user.email)}</small><br><small style="color:#64748b; font-size:0.75rem;">Joined: ${user.created_at || 'N/A'}</small>`;
                div.onclick = () => {
                    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                    showUserChats(user._id);
                };
                container.appendChild(div);
            });
        }

        function showUserChats(userId) {
            const box = document.getElementById('chatHistoryBox');
            box.style.display = "block";
            box.innerHTML = "";

            const userMessages = globalData.history.filter(h => h.user_id === userId);

            if(userMessages.length === 0) {
                box.innerHTML = "<p style='color:#6b7280; text-align:center; margin-top:20vh;'>This user has no recorded chat history.</p>";
                return;
            }

            userMessages.sort((a,b) => new Date(a.timestamp || 0) - new Date(b.timestamp || 0));

            userMessages.forEach(msg => {
                const uDiv = document.createElement('div');
                uDiv.className = "chat-bubble u";
                uDiv.innerHTML = `${escapeHtml(msg.user_message)}<span class="time">${msg.timestamp || ''}</span>`;
                box.appendChild(uDiv);

                const bDiv = document.createElement('div');
                bDiv.className = "chat-bubble b";
                bDiv.innerHTML = `${escapeHtml(msg.bot_reply)}<span class="time">${msg.timestamp || ''}</span>`;
                box.appendChild(bDiv);
            });
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function logout() {
            await fetch('/adise_secure_admin_portal_99/logout', {method: 'POST'});
            window.location.href = '/adise_secure_admin_portal_99';
        }

        fetchAdminData();
    </script>
</body>
</html>
