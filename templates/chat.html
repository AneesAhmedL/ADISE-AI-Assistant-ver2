<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADISE - Workspace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <style>
        /* Mobile Layout & Viewport Optimization */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            height: 100dvh; /* Adapts dynamically to mobile browser address bars */
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 12px;
            box-sizing: border-box;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-container {
            padding: 12px 16px;
            box-sizing: border-box;
            background: inherit;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Mobile specific adjustments */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px; /* Compact icon width on mobile screens */
                padding: 8px 4px;
            }
            
            .recent-chats {
                display: none; /* Hide long thread list on mobile to save vertical space */
            }

            .sidebar-btn span.btn-text {
                display: none;
            }

            .input-container {
                padding: 8px 12px;
                margin-bottom: env(safe-area-inset-bottom, 0px); /* Respect mobile safe areas */
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <a href="{{ url_for('home') }}" class="sidebar-btn home-btn">
                🏠 <span class="btn-text">Home</span>
            </a>

            <button class="sidebar-btn new-chat-btn" id="newChatBtn">
                + <span class="btn-text">New Chat</span>
            </button>

            <div class="recent-chats">
                <h3>RECENT CHATS</h3>
                <div id="threadsList"></div>
            </div>

            <!-- Logout Button -->
            <button class="sidebar-btn logout-btn" id="logoutBtn" style="
                margin-top: auto;
                width: 100%;
                background: linear-gradient(135deg, #e11d48, #9f1239);
                color: #ffffff;
                border: none;
                border-radius: 8px;
                padding: 12px 8px;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
" 
onmouseover="this.style.background='linear-gradient(135deg, #f43f5e, #be123c)'; this.style.boxShadow='0 6px 20px rgba(244, 63, 94, 0.4)';" 
onmouseout="this.style.background='linear-gradient(135deg, #e11d48, #9f1239)'; this.style.boxShadow='0 4px 12px rgba(225, 29, 72, 0.25)';"
>
                🚪 <span class="btn-text">Logout</span>
            </button>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-main">
            <div id="chatMessages" class="chat-messages">
                <div class="message bot">
                    Welcome to ADISE Chatbot! Ask ADISE anything you want to know.
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="userInput" placeholder="Ask ADISE..." autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <!-- Logout Logic Script -->
    <script>
        async function handleLogout() {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                if (response.ok) {
                    window.location.href = '/login_page';
                }
            } catch (err) {
                console.error("Logout failed:", err);
            }
        }

        document.getElementById("logoutBtn")?.addEventListener("click", handleLogout);
    </script>
</body>
</html>
