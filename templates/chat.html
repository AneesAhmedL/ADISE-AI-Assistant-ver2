<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ADISE - Workspace</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/ADISE2-Rlogo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    
    <!-- KaTeX CSS for LaTeX Math Formatting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Styling & Toggle Transition */
        .sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 16px 12px;
            box-sizing: border-box;
            background: #1e1e2f;
            color: #ffffff;
            width: 260px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        /* Mobile Collapsible Behaviour */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateX(-100%);
            }
            .app-container.sidebar-active .sidebar {
                transform: translateX(0);
                box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            }
        }

        /* Mobile Hamburger Toggle Bar */
        .mobile-header {
            display: none;
            align-items: center;
            padding: 10px 16px;
            background: #161622;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 768px) {
            .mobile-header {
                display: flex;
            }
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: #0f0f17;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Premium Welcome Box */
        .welcome-box {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.05));
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .input-container {
            padding: 16px;
            box-sizing: border-box;
            background: #161622;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .recent-chats {
            flex: 1;
            overflow-y: auto;
            margin-top: 16px;
        }

        .recent-chats h3 {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #8e8ea0;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <a href="{{ url_for('home') }}" class="sidebar-btn home-btn">
                🏠 <span class="btn-text">Home</span>
            </a>

            <button class="sidebar-btn new-chat-btn" id="newChatBtn">
                + <span class="btn-text">New Chat</span>
            </button>

            <div class="recent-chats">
                <h3>RECENT CHATS</h3>
                <div id="threadsList"></div>
            </div>

            <!-- Logout Button -->
            <button class="sidebar-btn logout-btn" id="logoutBtn" style="
                margin-top: auto;
                width: 100%;
                background: linear-gradient(135deg, #e11d48, #9f1239);
                color: #ffffff;
                border: none;
                border-radius: 8px;
                padding: 12px 8px;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            ">
                🚪 <span class="btn-text">Logout</span>
            </button>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-main">
            <!-- Mobile Toggle Header Bar -->
            <div class="mobile-header">
                <button class="menu-toggle-btn" id="menuToggleBtn">☰</button>
                <span style="font-weight: 600; margin-left: 10px; font-size: 1rem;">ADISE Workspace</span>
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="welcome-box">
                    <div style="font-size: 1.3rem; font-weight: 700; color: #818cf8; margin-bottom: 6px;">Hello, {{ username }} ✨</div>
                    <div style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.5;">Welcome to ADISE. Ask anything, solve complex equations, or explore ideas with real-time web intelligence.</div>
                </div>
            </div>

            <div class="input-container">
                <input type="text" id="userInput" placeholder="Ask ADISE anything..." autocomplete="off" style="flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: #1e1e2f; color: white; outline: none;">
                <button id="sendBtn" style="padding: 12px 20px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Send</button>
            </div>
        </main>
    </div>

    <!-- External Rendering Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <!-- Sidebar Toggle & History Management Script -->
    <script>
        // Sidebar Touch-to-Toggle Logic
        const menuToggleBtn = document.getElementById("menuToggleBtn");
        const appContainer = document.getElementById("appContainer");
        const sidebar = document.getElementById("sidebar");

        menuToggleBtn?.addEventListener("click", (e) => {
            e.stopPropagation();
            appContainer.classList.toggle("sidebar-active");
        });

        // Close sidebar when clicking outside on mobile view
        document.addEventListener("click", (e) => {
            if (window.innerWidth <= 768 && appContainer.classList.contains("sidebar-active")) {
                if (!sidebar.contains(e.target) && e.target !== menuToggleBtn) {
                    appContainer.classList.remove("sidebar-active");
                }
            }
        });

        function renderFormattedText(element, rawText) {
            let html = window.marked ? marked.parse(rawText) : rawText;
            element.innerHTML = html;
            
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }

        async function loadActiveThreadMessages(sessionId) {
            const chatBox = document.getElementById("chatMessages");
            try {
                const response = await fetch(`/get_thread_messages/${sessionId}`);
                const data = await response.json();
                
                if (data.messages && data.messages.length > 0) {
                    chatBox.innerHTML = "";
                    data.messages.forEach(msg => {
                        if (msg.user) {
                            const userDiv = document.createElement("div");
                            userDiv.className = "message user";
                            userDiv.textContent = msg.user;
                            chatBox.appendChild(userDiv);
                        }
                        if (msg.bot) {
                            const botDiv = document.createElement("div");
                            botDiv.className = "message bot";
                            renderFormattedText(botDiv, msg.bot);
                            chatBox.appendChild(botDiv);
                        }
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                console.error("Failed to restore thread history:", err);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const activeSessionId = localStorage.getItem("current_session_id");
            if (activeSessionId) {
                loadActiveThreadMessages(activeSessionId);
            }
        });

        async function handleLogout() {
            try {
                const response = await fetch('/logout', { method: 'POST' });
                if (response.ok) {
                    localStorage.removeItem("current_session_id");
                    window.location.href = '/login_page';
                }
            } catch (err) {
                console.error("Logout failed:", err);
            }
        }

        document.getElementById("logoutBtn")?.addEventListener("click", handleLogout);
    </script>
</body>
</html>
